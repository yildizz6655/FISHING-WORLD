
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FISHING WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#061b35;font-family:Arial;color:white}
canvas{display:block}
#hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#06243acc;padding:12px;border-radius:12px}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:12px}
button{padding:14px 20px;border:1px solid #65ddff;border-radius:12px;background:#087eae;color:white;font-weight:bold}
#message{position:absolute;top:75px;width:100%;text-align:center;text-shadow:0 2px 5px black}
</style>
</head>
<body>
<div id="hud">
 <div class="panel">🎣 FISHING WORLD</div>
 <div class="panel">💰 1.000 TL</div>
</div>
<div id="message">Okyanusa hoş geldin!</div>
<div id="controls">
 <button id="left">◀</button>
 <button id="forward">▲ GAZ</button>
 <button id="right">▶</button>
 <button id="camera">📷 KAMERA</button>
</div>
<script type="module" src="./js/game.js"></script>
</body>
</html>
