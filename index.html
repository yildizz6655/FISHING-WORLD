
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FishingWorld</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="loading-screen">
            <h1>🎣 FISHING WORLD</h1>
            <p>Balıkçılık macerasına hazırlan!</p>
            <button id="start-game">OYUNA BAŞLA</button>
        </div>

        <div id="game-ui">
            <div class="top-bar">
                <h2>🎣 FishingWorld</h2>
                <span id="money">💰 0 TL</span>
            </div>

            <div id="boat-info">
                <span>🚤 TEKNE</span>
                <span id="speed">0 KM/H</span>
            </div>

            <div id="controls">
                <div id="steering-area">
                    <div id="steering-wheel">◉</div>
                    <p>DİREKSİYON</p>
                </div>

                <div id="throttle-area">
                    <div id="throttle">
                        <div id="throttle-handle"></div>
                    </div>
                    <p>GAZ / GERİ</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
