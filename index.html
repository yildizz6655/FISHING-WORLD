
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#087fa9">
  <title>FISHING WORLD</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #86cbed;
      color: white;
      touch-action: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    button {
      cursor: pointer;
      color: white;
      font-family: Arial, sans-serif;
      font-weight: bold;
      border: none;
    }

    /* BAŞLANGIÇ MENÜSÜ */

    #menu {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        linear-gradient(180deg, #063653dd, #031526ee);
    }

    #menu h1 {
      font-size: 38px;
      margin-bottom: 8px;
      text-shadow: 0 4px 12px #000;
    }

    #menu p {
      color: #c9eaff;
      font-size: 16px;
      margin-bottom: 30px;
    }

    #start {
      padding: 16px 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #21a7e8, #0871b5);
      box-shadow: 0 5px 0 #064c78;
      font-size: 19px;
    }

    #start:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    /* BİLGİ PANELİ */

    #hud {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      flex-direction: column;
      gap: 7px;
      padding: 11px 14px;
      border: 1px solid #ffffff44;
      border-radius: 12px;
      background: #092b42cc;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 3px 10px #0005;
    }

    #speed {
      display: none;
      position: fixed;
      top: 14px;
      right: 78px;
      z-index: 10;
      padding: 10px 12px;
      border-radius: 10px;
      background: #092b42cc;
      font-weight: bold;
      font-size: 14px;
    }

    /* MESAJ */

    #message {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      text-shadow: 0 2px 5px #000;
      pointer-events: none;
    }

    /* GAZ VE FREN ALANI */

    #controls {
      display: none;
      position: fixed;
      right: 12px;
      bottom: 18px;
      z-index: 20;
      align-items: flex-end;
      gap: 12px;
    }

    /* OLTA BUTONU */

    #fish {
      position: fixed;
      right: 15px;
      bottom: 140px;
      z-index: 20;
      padding: 12px 18px;
      border: 2px solid #ffffffaa;
      border-radius: 12px;
      background: linear-gradient(135deg, #119cc9, #075b8a);
      font-size: 15px;
      box-shadow: 0 4px 10px #0006;
    }

    #fish:active {
      transform: scale(.94);
    }

    /* KAMERA */

    #camera {
      display: none;
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000000;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #102c46cc;
      border: 1px solid #ffffff88;
      color: white;
      font-size: 25px;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: 0 4px 12px #0008;
    }

    #camera:active {
      transform: scale(.9);
    }

    @media(max-width: 500px) {
      #menu h1 {
        font-size: 30px;
      }

      #controls {
        right: 10px;
        bottom: 18px;
        gap: 9px;
      }

      #fish {
        bottom: 130px;
      }

      #message {
        top: 95px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- BAŞLANGIÇ MENÜSÜ -->
  <div id="menu">
    <h1>🎣 FISHING WORLD</h1>
    <p>Denize açıl ve balık tut!</p>
    <button id="start" onclick="startFishingGame()">
      OYUNA BAŞLA
    </button>
  </div>

  <!-- BİLGİLER -->
  <div id="hud">
    <div>💰 Para: <span id="money">1.000</span> TL</div>
    <div>🐟 Yakalanan: <span id="caught">0</span></div>
  </div>

  <div id="speed">HIZ: 0 KM/H</div>

  <!-- MESAJ -->
  <div id="message">Fishing World'e hoş geldin!</div>

  <!-- KAMERA -->
  <button id="camera" type="button" aria-label="Kamerayı değiştir">
    📷
  </button>

  <!-- OLTA -->
  <button id="fish" type="button">
    🎣 OLTA
  </button>

  <!-- GAZ VE FREN -->
  <div id="controls">
    <button id="brake" type="button">▼<br>FREN</button>
    <button id="forward" type="button">▲<br>GAZ</button>
  </div>

  <!-- OYUN JAVASCRIPT -->
  <script type="module" src="./js/game.js"></script>

</body>
</html>
