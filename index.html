
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#061b35">
<title>FISHING WORLD</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#061b35;
 font-family:Arial;color:white;
}
canvas{display:block;width:100%;height:100%}
#hud{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;
 gap:8px;pointer-events:none;
}
.panel{
 background:#06243acc;padding:10px 12px;
 border:1px solid #40cfff;border-radius:12px;
 font-size:14px;
}
#message{
 position:absolute;top:65px;width:100%;
 text-align:center;text-shadow:0 2px 5px black;
 font-weight:bold;
}
#controls{
 position:absolute;bottom:15px;left:15px;right:15px;
 display:flex;justify-content:space-between;
 align-items:end;
}
.control-group{display:flex;gap:8px}
button{
 min-width:55px;min-height:52px;
 padding:10px;border:1px solid #65ddff;
 border-radius:13px;background:#087eae;
 color:white;font-weight:bold;font-size:15px;
 touch-action:none;
}
#fish{background:#087eae}
@media screen and (orientation:landscape){
 #hud{top:8px}
 #controls{bottom:10px}
 button{min-width:65px;min-height:58px}
}
@media screen and (orientation:portrait){
 #message:after{
  content:" Telefonunu yatay çevir!";
  display:block;margin-top:10px;color:#65ddff;
 }
}
</style>
</head>
<body>

<div id="hud">
 <div class="panel">🎣 FISHING WORLD</div>
 <div class="panel">💰 <span id="money">1.000</span> TL</div>
 <div class="panel">🐟 <span id="caught">0</span> balık</div>
</div>

<div id="message">Okyanusa hoş geldin!</div>

<div id="controls">
 <div class="control-group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="control-group">
  <button id="forward">▲ GAZ</button>
  <button id="fish">🎣 OLTA</button>
  <button id="camera">📷</button>
 </div>
</div>

<script type="module" src="./js/game.js"></script>
</body>
</html>
